services:
  parcelaireweb:
    build: .
    # Form YAML liste pour éviter toute imbrication de quotes ambiguë
    # (le `>` + `sh -c "…"` mangeait l'argument `--bind`, gunicorn
    # restait alors sur 127.0.0.1 et le frontal renvoyait Bad Gateway).
    # `exec gunicorn` remplace le shell par gunicorn → PID 1 dans le
    # container (meilleure gestion de SIGTERM, log gunicorn direct).
    command:
      - sh
      - -c
      - |
        set -e
        # migrate AVANT collectstatic/gunicorn : un `docker compose up` sur une
        # base neuve ne doit pas servir gunicorn contre une DB non migrée
        # (sinon 500 sur toute vue ORM). migrate est idempotent.
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        # --workers gthread + --threads = workers asynchrones (l'I/O des
        #   gros uploads ne bloque pas le worker, qui peut continuer à
        #   accepter d'autres requêtes).
        # --timeout 600 = 10 min : un GeoTIFF de plusieurs Go transite
        #   sans être coupé. La tâche GDAL, elle, tourne dans Celery.
        # --limit-request-line 16384 et --limit-request-field_size 65536
        #   évitent les "Request Line too long" si l'URL ou des cookies
        #   sont gros.
        exec gunicorn parcelaireKG.wsgi:application \
            --bind 0.0.0.0:8000 \
            --worker-class gthread \
            --workers 3 \
            --threads 4 \
            --timeout 600 \
            --graceful-timeout 60 \
            --keep-alive 5 \
            --limit-request-line 16384 \
            --limit-request-field_size 65536 \
            --access-logfile - \
            --error-logfile -
    volumes:
      # Pas de bind-mount du code source : l'image buildée fait foi en prod
      # (rollback par tag d'image, et aucun fichier hôte — .env/.git/db.sqlite3 —
      # embarqué dans le conteneur). Mise à jour du code = `docker compose build`.
      # Pour du live-reload en dev local, ajouter `- .:/app` dans un
      # docker-compose.override.yml (gitignoré, non déployé).
      - static_volume:/app/staticfiles
      # Volume nommé : persistant et sauvegardable depuis Dockploy.
      - media_data:/app/media
    expose:
      # Backend interne, joint par le frontend Nginx.
      - "8000"
    environment:
      # Production forcée : prod.py + DEBUG désactivé, indépendamment du .env
      # (corrige la faille où la prod tournait en réalité sur dev.py/DEBUG=True).
      - DJANGO_ENV=prod
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=parcelaireKG.settings
      - STATIC_ROOT=/app/staticfiles
      - MEDIA_ROOT=/app/media
      - ORTHO_ROOT=/app/media/tiles_ortho

      # Base de données
      - DB_ENGINE=django.contrib.gis.db.backends.postgis
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=parcelairedb
      - DB_PORT=5432

      # Redis / Celery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

      # API CRM externe
      - EXTERNAL_LOTS_API_URL=${EXTERNAL_LOTS_API_URL}
      - EXTERNAL_LOTS_API_KEY=${EXTERNAL_LOTS_API_KEY}
      - EXTERNAL_LOTS_API_USERNAME=${EXTERNAL_LOTS_API_USERNAME}
      - EXTERNAL_LOTS_API_PASSWORD=${EXTERNAL_LOTS_API_PASSWORD}

      # MinIO / S3 — stockage objet pour les TIFF source
      # Hostname interne = nom du service Docker (Docker DNS) ;
      # hostname externe = domaine public configuré dans Dockploy et le .env.
      - S3_ENDPOINT_URL=http://parcelaire-orthos3:9000
      - S3_ENDPOINT_URL_EXTERNAL=https://${MINIO_S3_HOST:-s3-parcelaire.${DOMAIN}}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${MINIO_BUCKET:-parcelaire-orthophotos}
      - S3_REGION=us-east-1

      # Django
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - SITE_ID=${SITE_ID:-1}
      - TIME_ZONE=${TIME_ZONE:-Africa/Abidjan}
    env_file:
      - .env
    depends_on:
      parcelairedb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8000), 5); s.close()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Frontend public : build Vite servi par Nginx. Dockploy doit router le
  # domaine principal vers ce service sur le port 80. Nginx transmet ensuite
  # uniquement les routes backend (/api, /accounts, /admin, /media, etc.) à
  # parcelaireweb sur le réseau Docker privé.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      parcelaireweb:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - default
    restart: unless-stopped

  parcelairecelery:
    build: .
    command: celery -A parcelaire.celery:app worker -l info
    volumes:
      # Données partagées avec parcelaireweb (tuiles générées par Celery).
      - media_data:/app/media
      - static_volume:/app/staticfiles
    environment:
      # Production forcée : prod.py + DEBUG désactivé, indépendamment du .env
      # (corrige la faille où la prod tournait en réalité sur dev.py/DEBUG=True).
      - DJANGO_ENV=prod
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=parcelaireKG.settings
      - STATIC_ROOT=/app/staticfiles
      - MEDIA_ROOT=/app/media
      - ORTHO_ROOT=/app/media/tiles_ortho
      # Base de données
      - DB_ENGINE=django.contrib.gis.db.backends.postgis
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=parcelairedb
      - DB_PORT=5432

      # Redis / Celery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

      # API CRM externe
      - EXTERNAL_LOTS_API_URL=${EXTERNAL_LOTS_API_URL}
      - EXTERNAL_LOTS_API_KEY=${EXTERNAL_LOTS_API_KEY}
      - EXTERNAL_LOTS_API_USERNAME=${EXTERNAL_LOTS_API_USERNAME}
      - EXTERNAL_LOTS_API_PASSWORD=${EXTERNAL_LOTS_API_PASSWORD}

      # MinIO / S3 — stockage objet pour les TIFF source
      # Hostname interne = nom du service Docker (Docker DNS) ;
      # hostname externe = domaine public configuré dans Dockploy et le .env.
      - S3_ENDPOINT_URL=http://parcelaire-orthos3:9000
      - S3_ENDPOINT_URL_EXTERNAL=https://${MINIO_S3_HOST:-s3-parcelaire.${DOMAIN}}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${MINIO_BUCKET:-parcelaire-orthophotos}
      - S3_REGION=us-east-1

      - SECRET_KEY=${SECRET_KEY}
      - TIME_ZONE=${TIME_ZONE:-Africa/Abidjan}
    env_file:
      - .env
    depends_on:
      parcelairedb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  parcelairebeat:
    build: .
    command: celery -A parcelaire.celery:app beat -l info
    volumes:
      # Idem parcelairecelery : volume média partagé, pas de bind du code source.
      - media_data:/app/media
      - static_volume:/app/staticfiles

    environment:
      # Production forcée : prod.py + DEBUG désactivé, indépendamment du .env
      # (corrige la faille où la prod tournait en réalité sur dev.py/DEBUG=True).
      - DJANGO_ENV=prod
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=parcelaireKG.settings
      - STATIC_ROOT=/app/staticfiles
      - MEDIA_ROOT=/app/media
      - ORTHO_ROOT=/app/media/tiles_ortho

      # Base de données
      - DB_ENGINE=django.contrib.gis.db.backends.postgis
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=parcelairedb
      - DB_PORT=5432

      # Redis / Celery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

      # API CRM externe
      - EXTERNAL_LOTS_API_URL=${EXTERNAL_LOTS_API_URL}
      - EXTERNAL_LOTS_API_KEY=${EXTERNAL_LOTS_API_KEY}
      - EXTERNAL_LOTS_API_USERNAME=${EXTERNAL_LOTS_API_USERNAME}
      - EXTERNAL_LOTS_API_PASSWORD=${EXTERNAL_LOTS_API_PASSWORD}

      # MinIO / S3 — stockage objet pour les TIFF source
      # Hostname interne = nom du service Docker (Docker DNS) ;
      # hostname externe = domaine public configuré dans Dockploy et le .env.
      - S3_ENDPOINT_URL=http://parcelaire-orthos3:9000
      - S3_ENDPOINT_URL_EXTERNAL=https://${MINIO_S3_HOST:-s3-parcelaire.${DOMAIN}}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${MINIO_BUCKET:-parcelaire-orthophotos}
      - S3_REGION=us-east-1

      - SECRET_KEY=${SECRET_KEY}
      - TIME_ZONE=${TIME_ZONE:-Africa/Abidjan}
    env_file:
      - .env
    depends_on:
      parcelairedb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  parcelairedb:
    image: postgis/postgis:15-3.4
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=${TIME_ZONE:-Africa/Abidjan}
      - PGTZ=${TIME_ZONE:-Africa/Abidjan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  # =================================================================
  # MinIO dédié au parcellaire — stockage S3-compatible des orthophotos.
  # Tous les noms (service / volume) sont préfixés `parcelaire-orthos3`
  # pour ne pas entrer en conflit avec une autre instance MinIO.
  # Les sous-domaines publics sont configurables via `.env` :
  #   MINIO_S3_HOST       (default s3-parcelaire.${DOMAIN})
  #   MINIO_CONSOLE_HOST  (default minio-parcelaire.${DOMAIN})
  # =================================================================
  parcelaire-orthos3:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    hostname: parcelaire-orthos3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # URLs publiques utilisées pour les redirections de la console et
      # l'affichage de l'API S3 dans l'UI.
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_CONSOLE_HOST:-minio-parcelaire.${DOMAIN}}
      MINIO_SERVER_URL: https://${MINIO_S3_HOST:-s3-parcelaire.${DOMAIN}}
    volumes:
      - parcelaire_orthos3_data:/data
    expose:
      # Deux domaines Dockploy doivent cibler ce même service :
      # API S3 -> 9000 ; console MinIO -> 9001.
      - "9000"
      - "9001"
    networks:
      - default

  # Bootstrap : crée le bucket et configure la policy au premier démarrage.
  parcelaire-orthos3-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      - parcelaire-orthos3
    networks:
      - default
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-parcelaire-orthophotos}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set parc http://parcelaire-orthos3:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing parc/$$MINIO_BUCKET;
      mc anonymous set none parc/$$MINIO_BUCKET || true;
      echo 'MinIO bucket prêt (privé) : '$$MINIO_BUCKET;
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_data:
  parcelaire_orthos3_data:
