# Conserve le protocole public transmis par Dockploy. En accès local direct,
# utilise le protocole reçu par Nginx.
map $http_x_forwarded_proto $public_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $public_proto $hsts_header {
    default "";
    https   "max-age=31536000; includeSubDomains; preload";
}

server {
    listen 80;
    server_name _;

    # DNS interne Docker : force la re-résolution du nom `parcelaireweb`
    # (avec un nom en dur dans proxy_pass, Nginx fige l'IP au démarrage →
    # 502 sur tous les /api après chaque recréation du conteneur web).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Le GeoTIFF est envoyé directement à MinIO. Cette limite ne concerne que
    # les petites requêtes JSON/formulaires qui transitent vers Django.
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*;" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets Vite : cache long, les fichiers produits sont versionnés par
    # l'image du frontend et recréés à chaque déploiement.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Django reste le backend : API, admin, médias privés et endpoints
    # historiques encore utilisés par les actions orthophoto.
    # NB : /accounts/ (allauth HTML) n'est PLUS proxifié — l'authentification
    # est 100 % React (/api/auth/*), donc /accounts/* retombe sur le SPA.
    location ~ ^/(api|admin|media|static|orthophotos|ai|ajax)(/|$) {
        # Variable → Nginx re-résout le DNS à chaque requête (TTL 10 s) au lieu
        # de figer l'IP du conteneur au boot. L'URI d'origine est transmise
        # inchangée (proxy_pass sans partie chemin), comme avant.
        set $django_backend parcelaireweb;
        proxy_pass http://$django_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # HashRouter gère la navigation après le #. Le fallback permet aussi
    # d'ouvrir l'application sur n'importe quel chemin non réservé au backend.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
